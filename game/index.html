<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Vault — a midnight heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a18; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" aria-label="Velvet Vault: a stealth heist game. Move Wren with WASD or arrows, sneak with Shift, use tools with Q, E and R"></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
